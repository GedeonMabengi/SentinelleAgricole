version: '3.8'

services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelle_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sentinelle
      DB_USERNAME: sentinelle
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      CACHE_DRIVER: redis
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - postgres
      - redis
    networks:
      - sentinelle_network

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: sentinelle_nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - sentinelle_network

  # PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: sentinelle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelle
      POSTGRES_USER: sentinelle
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - sentinelle_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sentinelle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - sentinelle_network

  # ML Service (FastAPI)
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sentinelle_ml
    restart: unless-stopped
    environment:
      LLM_BASE_URL: http://ollama:11434
      USE_OLLAMA: "true"
      LLM_MODEL: llama3.2
    ports:
      - "8002:8000"
    volumes:
      - ./ml-service/app/models:/app/models
    depends_on:
      - ollama
    networks:
      - sentinelle_network

  # Ollama (LLM)
  ollama:
    image: ollama/ollama:latest
    container_name: sentinelle_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - sentinelle_network

  # Frontend React (dev mode)
  frontend:
    image: node:20-alpine
    container_name: sentinelle_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      VITE_API_URL: http://localhost:8001/api
    networks:
      - sentinelle_network

  # Laravel Queue Worker
  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentinelle_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: sentinelle
      DB_USERNAME: sentinelle
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      - backend
      - redis
    networks:
      - sentinelle_network

volumes:
  postgres_data:
  ollama_data:

networks:
  sentinelle_network:
    driver: bridge
